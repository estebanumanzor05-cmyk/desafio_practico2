<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de tours de un día por los 14 departamentos de El Salvador.">
    <title>Tours | Sivar Tours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&amp;family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a href="index.html" class="logo">Sivar <span>Tours</span></a>
            <nav aria-label="Menú principal">
                <ul id="menu-principal"></ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="banner">
            <div class="contenedor">
                <h1>Lo mejor de los 14 departamentos a tan solo un click</h1>
                <p>Elige tu tour, reserva tus cupos y sigue el estado de tu reserva.</p>
            </div>
        </section>

        <section class="seccion">
            <div class="contenedor">
                <form class="barra-filtros" id="filtros" role="search">
                    <div>
                        <label for="buscar">Buscar</label>
                        <input type="search" id="buscar" name="buscar" placeholder="Nombre del tour o departamento">
                    </div>
                    <div>
                        <label for="departamento">Departamento</label>
                        <select id="departamento" name="departamento">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div>
                        <label for="ordenar">Ordenar por</label>
                        <select id="ordenar" name="ordenar">
                            <option value="fecha">Fecha más próxima</option>
                            <option value="precio-asc">Precio: menor a mayor</option>
                            <option value="precio-desc">Precio: mayor a menor</option>
                            <option value="cupos">Más cupos disponibles</option>
                        </select>
                    </div>
                    <label class="casilla">
                        <input type="checkbox" id="solo-disponibles" name="soloDisponibles" checked>
                        Solo tours con cupos disponibles
                    </label>
                </form>

                <p class="resumen" id="resumen" aria-live="polite"></p>
                <div id="lista-tours"></div>
            </div>
        </section>
    </main>

    <dialog id="dialogo-reserva" aria-labelledby="titulo-reserva">
        <form class="formulario" id="formulario-reserva" novalidate>
            <h2 id="titulo-reserva">Reservar tour</h2>
            <p id="detalle-reserva"></p>
            <div class="campo">
                <label for="personas">Número de personas</label>
                <input type="number" id="personas" name="personas" min="1" max="10" value="1" required>
                <span class="error-campo" id="error-personas"></span>
            </div>
            <p class="total-reserva" id="total-reserva"></p>
            <div class="acciones-formulario">
                <button type="submit" class="boton boton-azul">Confirmar reserva</button>
                <button type="button" class="boton boton-borde" id="cancelar-dialogo">Cancelar</button>
            </div>
        </form>
    </dialog>

    <footer>
        <div class="contenedor">
            <p>© 2026 Sivar Tours · Turismo interno en El Salvador · Fotos: Wikimedia Commons</p>
        </div>
    </footer>

    <script type="module" src="js/paginas/catalogo.js"></script>
</body>
</html>
