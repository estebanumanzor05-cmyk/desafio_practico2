<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Sivar Tours para reservar tours.">
    <title>Iniciar sesión | Sivar Tours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&amp;family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a href="index.html" class="logo">Sivar <span>Tours</span></a>
            <nav aria-label="Menú principal">
                <ul id="menu-principal"></ul>
            </nav>
        </div>
    </header>

    <main class="seccion">
        <div class="contenedor">
            <form class="formulario" id="formulario-login" novalidate>
                <h1>Iniciar sesión</h1>
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" required>
                    <span class="error-campo" id="error-correo"></span>
                </div>
                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
                    <span class="error-campo" id="error-contrasena"></span>
                </div>
                <button type="submit" class="boton boton-azul">Entrar</button>
                <p class="texto-ayuda">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            </form>
        </div>
    </main>

    <footer>
        <div class="contenedor">
            <p>© 2026 Sivar Tours · Turismo interno en El Salvador · Fotos: Wikimedia Commons</p>
        </div>
    </footer>

    <script type="module" src="js/paginas/login.js"></script>
</body>
</html>
